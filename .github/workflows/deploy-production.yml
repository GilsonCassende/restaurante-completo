name: Deploy Production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm prisma:generate && pnpm lint && pnpm typecheck && pnpm build && pnpm test:integration
      - name: Production ready
        run: echo "Artefato validado. Conectar este job ao deploy final do provedor escolhido."

